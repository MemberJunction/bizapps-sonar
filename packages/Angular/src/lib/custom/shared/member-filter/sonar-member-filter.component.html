<!-- Compact when unused: just the add affordance. Grows only as conditions are added, because this
     sits inside an already-dense targeting panel. -->
<div class="sonar-memfilter" [class.sonar-memfilter--dense]="dense()">
    <!-- Omitted in dense mode: the rule pane's own group heading already says it. Not rendering beats
         hiding with CSS, which needed a class that existed only as a styling hook. -->
    @if (!dense()) {
        <span class="sonar-card__label sonar-memfilter__labelslot">Members</span>
    }

    @for (chip of chips(); track chip.index) {
        <span class="sonar-chip sonar-memfilter__chip">
            {{ chip.text }}
            <button type="button" class="sonar-memfilter__x" (click)="remove(chip.index)"
                    [attr.aria-label]="'Remove condition: ' + chip.text">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </span>
    }

    <div class="sonar-memfilter__anchor">
        <button type="button" class="sonar-chip sonar-memfilter__add" (click)="adding() ? cancelAdd() : openAdd()"
                [class.sonar-memfilter__add--on]="adding()" [attr.aria-expanded]="adding()"
                [disabled]="fields().length === 0"
                [title]="fields().length === 0
                    ? 'This model\'s anchor entity has no fields that can be targeted on'
                    : 'Narrow the cohort by something on the member record: tenure, region, activity'">
            <i class="fa-solid fa-plus"></i> Member filter
        </button>

        <!-- Floating popover anchored to the trigger, so adding a condition doesn't reflow the panel
             underneath (the member list keeps its height while you build the rule). -->
        @if (adding()) {
            <div class="sonar-card sonar-memfilter__pop" role="dialog" aria-label="Add a member condition">
                <label class="sonar-memfilter__row">
                    <span class="sonar-memfilter__rowlabel">Field</span>
                    <select class="sonar-input sonar-memfilter__select" [value]="draftField()"
                            (change)="pickField($any($event.target).value)">
                        @for (f of fields(); track f.name) {
                            <option [value]="f.name">{{ f.label }}</option>
                        }
                    </select>
                </label>

                <label class="sonar-memfilter__row">
                    <span class="sonar-memfilter__rowlabel">Test</span>
                    <select class="sonar-input sonar-memfilter__select" [value]="draftOp()"
                            (change)="pickOp($any($event.target).value)">
                        @for (o of draftOperators(); track o.op) {
                            <option [value]="o.op">{{ o.label }}</option>
                        }
                    </select>
                </label>

                @if (draftInput() !== 'none') {
                    <label class="sonar-memfilter__row">
                        <span class="sonar-memfilter__rowlabel">
                            {{ draftInput() === 'days' ? 'Days' : draftInput() === 'list' ? 'Values' : 'Value' }}
                        </span>
                        @if (draftInput() === 'days' || draftInput() === 'number') {
                            <input class="sonar-input sonar-memfilter__value" type="number" min="0" autofocus
                                   [value]="draftValue()" (input)="draftValue.set($any($event.target).value)"
                                   (keydown.enter)="commit()" />
                        } @else {
                            <input class="sonar-input sonar-memfilter__value" type="text" autofocus
                                   [placeholder]="draftInput() === 'list' ? 'comma separated' : ''"
                                   [value]="draftValue()" (input)="draftValue.set($any($event.target).value)"
                                   (keydown.enter)="commit()" />
                        }
                    </label>
                }

                <!-- Confirm on the LEFT, cancel on the right, per the project's dialog rule. -->
                <div class="sonar-memfilter__actions">
                    <button type="button" class="sonar-btn sonar-btn--primary" [disabled]="!canAdd()" (click)="commit()">
                        Add
                    </button>
                    <button type="button" class="sonar-btn sonar-btn--ghost" (click)="cancelAdd()">Cancel</button>
                </div>
            </div>
        }
    </div>

    @if (conditions().length > 1) {
        <button type="button" class="sonar-btn sonar-btn--ghost sonar-memfilter__clear" (click)="clearAll()">
            <i class="fa-solid fa-xmark"></i> Clear
        </button>
    }
</div>
