# Cuts the release pull request: `next` -> `release/vX.Y.Z` -> a PR into `main`.
#
# This is step 1 of docs/release.md. The steps are the same ones a human would type; what changes is
# who types them, and therefore whether the version that reaches npm was computed by the script or by
# a tired human at the end of a Friday. Ported from bizapps-forms, where the first run of this
# workflow failed on the push because checkout's persisted credential outranked the App token in the
# remote URL (bizapps-forms #226, and the persist-credentials note on the checkout below).
#
# NOT A PUSH TO A PROTECTED BRANCH, and this is the distinction the whole design turns on.
# `release/*` is covered by no ruleset — Sonar's one ruleset (protect-release-branches) is
# `target: branch` and its conditions name refs/heads/main and refs/heads/next and nothing else —
# so pushing it is an ordinary write. The branch then goes through a pull request like any other, and
# every PR check runs on it. The ruleset has no bypass actors; nothing here asks for an exception,
# and nothing here should ever be changed into asking for one. That stays true once the planned
# required-checks/strict rules land (docs/release.md, admin setup): they go on that same ruleset,
# which names only `main` and `next`.
#
# The one thing GITHUB_TOKEN cannot do is author that branch and that PR: GitHub does not start
# workflow runs from events it authors, so no check would report on the PR, and once the planned
# required checks land it could never merge (bizapps-forms #177's trap). Hence a GitHub App, minted
# from `vars.APP_CLIENT_ID` + `secrets.APP_PRIVATE_KEY`, whose only powers are `contents: write` and
# `pull-requests: write`. Run `verify-release-app-token.yml` if you need to know that credential is
# live.
#
# The work itself lives in scripts/release-prep.mjs, not here: a decision that only ever runs during
# a release cannot be proven by running a release, which is the argument release-plan.mjs and
# sync-app-version.mjs already make. This file is the plumbing around two calls —
#
#   --plan   pure read, always exits 0, emits `ready`, `version` and `branch`. It also runs the
#            release gates (lint:distribution, check:release-seed, check:seed-cadence,
#            check:pg-parity), so a seed that is owed shows up here, before any branch exists.
#   --apply  refuses non-zero if the preconditions fail; otherwise runs `pnpm run version`,
#            `pnpm install --lockfile-only`, verifies the postconditions and commits. It creates no
#            branch and pushes nothing — the branch and the push are this file's job, because they
#            are the parts that need a credential.
#
# `dry_run` runs the read half and stops: no branch, no commit, no PR, nothing on the remote.
# The name is the one docs/release.md step 1 tells a human to click, and the two must stay
# identical: GitHub's Actions sidebar lists a workflow by this field and nothing else, so a
# name that merely echoes the filename leaves the runbook pointing at a label that is not
# there. Imperative, matching `Verify the release App token` — these are things you do, not
# files you have.
name: Prepare a release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Compute the plan and stop — no branch, no commit, no pull request'
        type: boolean
        default: false

# Only the checkout uses this. Every write below goes through the App token, so trimming the job's
# own token to `read` means a bug here cannot write to the repository as Actions.
permissions:
  contents: read

# Never two at once. Both would compute the same version from the same tip of `next` and race to
# create the same branch; the loser fails on a rejected push after having already run the bump.
concurrency:
  group: release-prep
  cancel-in-progress: false

jobs:
  prepare:
    name: Cut the release PR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Pinned to `next`, not to the dispatch ref. A release is by definition the current tip of
          # the integration branch; letting whoever pressed the button choose the ref would let a
          # feature branch be cut as a release, and that mistake surfaces only in review, after the
          # CHANGELOGs have been rewritten. The workflow FILE still comes from the dispatch ref —
          # that is how workflow_dispatch resolves — so this file stays testable from its own branch
          # while the tree it operates on is always `next`.
          ref: next
          # `changeset version` rewrites CHANGELOGs from history and scripts/release-prep.mjs reads
          # tags to know what has already shipped. Neither survives a shallow clone.
          fetch-depth: 0
          fetch-tags: true
          # Without this the release cannot be pushed, and the error names neither credentials nor
          # this line. `persist-credentials: true` (the default) writes
          # `http.https://github.com/.extraheader: AUTHORIZATION: basic <GITHUB_TOKEN>` into the
          # LOCAL git config. That header matches every remote whose URL is github.com -- including
          # the `app-push` remote below, whose URL carries the App token -- and a config header
          # OUTRANKS credentials embedded in a remote's URL. So the push authenticates as
          # github-actions[bot], not as the App; this job deliberately holds `contents: read`, so it
          # is refused with:
          #
          #   remote: Permission to MemberJunction/<repo>.git denied to github-actions[bot].
          #   fatal: ... The requested URL returned error: 403
          #
          # Measured in bizapps-forms (#226), on a run that cut its release correctly and died on
          # the push. The identity in that message is the tell: the App itself is fine.
          #
          # Safe because nothing in this job WRITES to the remote except that one App-token push --
          # checkout still authenticates its OWN fetch, it simply leaves no credential behind. The
          # `git ls-remote origin` branch guard below then reads anonymously, which works only
          # because this repository is public; if it ever goes private that guard fails closed
          # (exit 128) and needs the App token instead. Do NOT copy this to publish.yml: that
          # workflow pushes the release tag through `origin` and needs the persisted credential.
          persist-credentials: false

      # Must precede setup-node: `cache: 'pnpm'` needs pnpm already on PATH.
      # Pinned to an immutable SHA, unlike the copy in build.yml, and the difference is deliberate:
      # this job mints a GitHub App installation token later in the same runner, so a compromised
      # release of this action would share a process with a credential that can write to the
      # repository. build.yml handles no credential and stays on the tag, matching MJ and the sibling
      # Open Apps. Rule: third-party actions are pinned in workflows that hold a secret key.
      # Re-resolve with: git ls-remote https://github.com/pnpm/action-setup refs/tags/v4^{}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Pure read. `ready: false` on a dry run is this workflow working, not failing — the point of
      # asking is that the answer can be no.
      - name: What would this release be?
        id: plan
        run: node scripts/release-prep.mjs --plan

      # Counted BEFORE --apply, because `changeset version` consumes the files: afterwards there is
      # nothing left to count, and "what went into this version" is the first thing a reviewer wants
      # to know. The find expression is publish.yml's, verbatim — the two must agree about what
      # counts as a changeset, since publish.yml refuses to release while any remain.
      - name: Inventory the changesets this release consumes
        id: changesets
        run: |
          set -euo pipefail
          FILES=$(find .changeset -name '*.md' -not -name 'README.md' | sort)
          COUNT=$(printf '%s' "$FILES" | grep -c . || true)
          LIST="$RUNNER_TEMP/changesets.md"
          : > "$LIST"
          if [ -n "$FILES" ]; then
            while IFS= read -r f; do
              # A changeset is a YAML front-matter block between two `---` lines, then the summary.
              # Drop the opening fence, seek the closing one, drop it, take the first non-empty line.
              # `|| true` because grep -m1 exits 1 with no match and SIGPIPEs its upstream on a hit.
              SUMMARY=$(tail -n +2 "$f" | sed -n '/^---$/,$p' | tail -n +2 | grep -m1 . || true)
              echo "- \`$(basename "$f")\` — ${SUMMARY:-(no summary in the changeset)}" >> "$LIST"
            done <<< "$FILES"
          fi
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "$COUNT changeset(s) to consume"
          cat "$LIST"

      - name: Dry run — this is where it stops
        if: ${{ inputs.dry_run }}
        env:
          READY: ${{ steps.plan.outputs.ready }}
          VERSION: ${{ steps.plan.outputs.version }}
          BRANCH: ${{ steps.plan.outputs.branch }}
          COUNT: ${{ steps.changesets.outputs.count }}
        run: |
          set -euo pipefail
          {
            echo "## Dry run — nothing was created"
            echo
            echo "| field | value |"
            echo "|---|---|"
            echo "| ready | \`$READY\` |"
            echo "| version | \`$VERSION\` |"
            echo "| branch | \`$BRANCH\` |"
            echo "| changesets | $COUNT |"
            echo
            cat "$RUNNER_TEMP/changesets.md"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$READY" != "true" ]; then
            echo "::warning::Not ready to cut a release — scripts/release-prep.mjs --plan said so above. A real run would refuse."
          fi

      # Guard clause, and the reason every step below carries only `if: ${{ !inputs.dry_run }}` and
      # not a readiness condition as well: a failed step stops the job, so refusing HERE is what
      # keeps an unready release out of the branch-creating half. `--apply` refuses too — it is the
      # authority on readiness and this step does not re-derive it — but it refuses after this
      # workflow would already have created a branch, and a stray `release/*` is then someone's
      # afternoon.
      - name: Refuse to cut a release that is not ready
        if: ${{ !inputs.dry_run }}
        env:
          READY: ${{ steps.plan.outputs.ready }}
          VERSION: ${{ steps.plan.outputs.version }}
          BRANCH: ${{ steps.plan.outputs.branch }}
        run: |
          set -euo pipefail
          if [ "$READY" != "true" ]; then
            echo "::error::scripts/release-prep.mjs --plan reports ready=$READY. Read its output above; it names what is missing."
            exit 1
          fi
          if [ -z "$VERSION" ] || [ -z "$BRANCH" ]; then
            echo "::error::--plan reported ready but left version='$VERSION' branch='$BRANCH' empty. Refusing to guess either."
            exit 1
          fi
          # Better than a rejected push five steps later, which reads as a credential problem and is
          # not one. A `release/*` branch already on the remote means the release PR was already cut
          # (go find it) or a previous run half-finished (delete it, or finish it by hand).
          #
          # Deliberately NOT `--exit-code`, which answers "no such ref" with 2 and "I could not
          # reach the remote" with 128. Treating both as "it does not exist" would let a dead
          # credential walk past this guard and fail at the push instead, which is precisely the
          # error this step exists to pre-empt.
          #
          # Captured by ASSIGNMENT, not tested inline as `if [ -n "$(...)" ]`. Errexit is suppressed
          # for the condition part of an `if`, and a command substitution's status is discarded when
          # it is only a word inside `[ ... ]` — so the inline form reads an unreachable remote as
          # "branch absent" and walks into the bump, the commit and the push, which is the exact
          # conflation the paragraph above rejects. `pipefail` cannot save it: it sets a status
          # nothing goes on to read. This is the form publish.yml's sibling guard already uses.
          EXISTING_BRANCH=$(git ls-remote --heads origin "refs/heads/$BRANCH" | cut -f1)
          if [ -n "$EXISTING_BRANCH" ]; then
            echo "::error::$BRANCH already exists on the remote. Either its pull request is already open, or a previous run left it behind — this workflow will not overwrite it."
            exit 1
          fi

      - name: Configure git credentials
        if: ${{ !inputs.dry_run }}
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      # The branch is created here and the commit is made by --apply, in that order, because the
      # script deliberately does neither of the two things that need a credential or a destination.
      # Committer identity is cosmetic: what decides whether the PR's checks run at all is the token
      # the PUSH is authenticated with, not who authored the commit.
      - name: Cut the release branch and bump the version
        if: ${{ !inputs.dry_run }}
        env:
          BRANCH: ${{ steps.plan.outputs.branch }}
        run: |
          set -euo pipefail
          git switch -c "$BRANCH"
          node scripts/release-prep.mjs --apply

      - name: Compose the pull request body
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          BRANCH: ${{ steps.plan.outputs.branch }}
          COUNT: ${{ steps.changesets.outputs.count }}
        run: |
          set -euo pipefail
          {
            echo "Cut from \`next\` by \`.github/workflows/release-prep.yml\`."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| version | **v$VERSION** |"
            echo "| changesets consumed | $COUNT |"
            echo "| branch | \`$BRANCH\` |"
            echo
            echo "### What this release contains"
            echo
            cat "$RUNNER_TEMP/changesets.md"
            echo
            echo "### What needs human eyes"
            echo
            echo "Everything below is something no gate downstream can second-guess."
            echo
            echo "- [ ] **The version.** \`changeset version\` chose v$VERSION from the changesets above, and that is"
            echo "  the version that will be published. A migration or a \`metadata/\` change must ship as at least a"
            echo "  **minor** — publish.yml fails the release if \`migrations/\` or \`migrations-pg/\` moved since the"
            echo "  last tag and the version only moved by a patch, but it fails it *after* this PR has merged, so"
            echo "  catching it here is much cheaper."
            echo "- [ ] **The consolidated seed and its PostgreSQL twin both exist.** Feature PRs contribute"
            echo "  declarative JSON under \`metadata/\` and no seed migration; the build engineer generates ONE"
            echo "  \`migrations/V<ts>__v<x.y>.x__Metadata_Sync.sql\` per release, plus its"
            echo "  \`migrations-pg/V<ts>__v<x.y>.x__Metadata_Sync.pg.sql\` twin, by the recipe in"
            echo "  \`migrations/README.md\`. The release-readiness gates (\`check:release-seed\`, \`check:seed-cadence\`,"
            echo "  \`check:pg-parity\`) already passed for this branch to exist; this is the human check that the seed"
            echo "  is the one you meant to ship."
            echo "- [ ] **The CHANGELOGs.** They are what consumers read, and they are generated from changeset"
            echo "  summaries written weeks ago by people who were describing a diff, not a release."
            echo
            echo "### On merge"
            echo
            echo "Merge with a **merge commit**. That triggers \`publish.yml\`, which builds, runs the"
            echo "release-readiness gates, publishes to npm, tags \`v$VERSION\`, and opens the \`main\` -> \`next\`"
            echo "back-merge PR."
            echo
            echo "**A green publish run means it did all of that** — publishing and the back-merge PR both."
            echo "Red before \`Publish to npm\` means nothing shipped: fix and re-run. Red after it: re-run"
            echo "\`publish.yml\` on main to finish (docs/release.md step 3) — it publishes only what is missing,"
            echo "tags only if the tag is absent, and opens the back-merge PR only if none is open."
          } > "$RUNNER_TEMP/release-pr-body.md"

      # Minted LATE, immediately before use, and that is load-bearing: an installation token lives
      # one hour, while everything above it — a cold `pnpm install`, `changeset version`, a lockfile
      # regeneration — is measured in minutes and grows with the repo. A token minted at checkout is
      # a token that will eventually expire mid-release, on a day nobody changed anything.
      - name: Mint the App token for the push and the pull request
        if: ${{ !inputs.dry_run }}
        id: token
        uses: actions/create-github-app-token@v2
        with:
          # `app-id`, not `client-id`: v2 of this action declares only `app-id` (required), and it
          # accepts a client ID as well as a numeric app id, which is what the org variable holds.
          app-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Least privilege, named at the call site rather than inherited from whatever the App
          # happens to hold. Two effects: this token's blast radius is legible right here, and if the
          # App's grants are ever trimmed the mint fails HERE with a clear error instead of surfacing
          # as a push that dies looking like the branch protection this whole design works around.
          # contents -> the push of `release/*`; pull-requests -> the PR into `main`.
          permission-contents: write
          permission-pull-requests: write

      - name: Push the release branch and open the pull request
        if: ${{ !inputs.dry_run }}
        id: pr
        env:
          APP_TOKEN: ${{ steps.token.outputs.token }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
          VERSION: ${{ steps.plan.outputs.version }}
          BRANCH: ${{ steps.plan.outputs.branch }}
        run: |
          set -euo pipefail
          # A second remote rather than re-pointing `origin`. The App token is the credential for
          # exactly one write; leaving it in `origin`'s URL would hand it silently to every later
          # step that happens to touch the remote, which is the opposite of naming the permissions
          # at the call site above.
          git remote remove app-push 2>/dev/null || true
          git remote add app-push "https://x-access-token:$APP_TOKEN@github.com/$GITHUB_REPOSITORY"
          git push app-push "HEAD:refs/heads/$BRANCH"

          PR_URL=$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$BRANCH" \
            --title "Release v$VERSION" \
            --body-file "$RUNNER_TEMP/release-pr-body.md")
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "::notice::Release PR: $PR_URL"

      - name: Summary
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          BRANCH: ${{ steps.plan.outputs.branch }}
          COUNT: ${{ steps.changesets.outputs.count }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
        run: |
          set -euo pipefail
          {
            echo "## Release v$VERSION is ready for review"
            echo
            echo "$PR_URL"
            echo
            echo "| field | value |"
            echo "|---|---|"
            echo "| version | \`v$VERSION\` |"
            echo "| branch | \`$BRANCH\` |"
            echo "| changesets consumed | $COUNT |"
            echo "| opened as | \`${{ steps.token.outputs.app-slug }}\` |"
            echo
            echo "Every PR check runs on it like any other pull request — the App holds no ruleset bypass, and"
            echo "is used here only because a PR authored with \`GITHUB_TOKEN\` starts no workflow runs, so no"
            echo "check would ever report on it."
          } >> "$GITHUB_STEP_SUMMARY"
