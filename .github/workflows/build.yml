name: Build All Packages

on:
  workflow_dispatch:
  push:
    branches: [next]
  pull_request:
    branches: [next]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-only:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Must precede setup-node: `cache: 'pnpm'` needs pnpm already on PATH.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Validate repository.url in packages
        run: ./.github/scripts/validate-package-repository.sh

      # A host installs one copy of MemberJunction and one copy of each Open App. A published package
      # that brings its own (MJ or another app's @mj-biz-apps/* in `dependencies`, or a `~`/exact peer
      # that rejects the host's next minor — `~6.1.5` refuses every 6.2 host) splits MJ's class-factory
      # registry, and registrations miss silently. Shared verbatim across the BizApps family; Node
      # only, so it runs before the install. Self-test first: a validator nobody has seen fail proves
      # nothing.
      - name: Validate the one-copy dependency model
        run: |
          node .github/scripts/check-dependency-model.mjs --self-test
          node .github/scripts/check-dependency-model.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm run build:packages

      # Three packages carry real vitest suites (Engine, CoreEntitiesServer, Actions) that CI
      # never ran before this step existed. --if-present keeps the echo-stub workspaces harmless.
      - name: Unit tests
        run: pnpm test

      # Guarded until PR #60 lands the parity checker; then the guard is dead weight to remove.
      - name: PostgreSQL parity gate
        run: |
          if [ -f scripts/check-pg-parity.mjs ]; then
            node scripts/check-pg-parity.mjs
          else
            echo "scripts/check-pg-parity.mjs not present yet (PR #60) — skipping"
          fi
