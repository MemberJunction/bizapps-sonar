name: Build All Packages

on:
  workflow_dispatch:
  push:
    branches: [next]
  pull_request:
    branches: [next]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-only:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Validate repository.url in packages
        run: ./.github/scripts/validate-package-repository.sh

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build:packages

      # Three packages carry real vitest suites (Engine, CoreEntitiesServer, Actions) that CI
      # never ran before this step existed. --if-present keeps the echo-stub workspaces harmless.
      - name: Unit tests
        run: npm test

      # Guarded until PR #60 lands the parity checker; then the guard is dead weight to remove.
      - name: PostgreSQL parity gate
        run: |
          if [ -f scripts/check-pg-parity.mjs ]; then
            node scripts/check-pg-parity.mjs
          else
            echo "scripts/check-pg-parity.mjs not present yet (PR #60) — skipping"
          fi
