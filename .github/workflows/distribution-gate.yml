name: Distribution Gate

# Catches SQL carrying a placeholder `mj app install` cannot resolve (Skyway leaves unknown ones
# untouched, so they ship as literal strings rather than erroring), in both dialects and both
# teardown sets. Metadata currency is NOT gated here: PRs contribute declarative JSON only, and the
# build engineer generates one consolidated Metadata_Sync per release, so between releases metadata/
# is ahead of the seed by design. That question is asked at the release, by publish.yml
# (check:release-seed + check:seed-cadence). Reasoning: scripts/check-distribution-seed.mjs,
# migrations/README.md, MJ/metadata/CLAUDE.md §1b. Mirrors bizapps-sales / bizapps-common.

on:
  workflow_dispatch:
  # `push` as well as `pull_request`: the PR trigger alone would let a direct commit to next/main
  # land an unresolvable placeholder without the gate ever running.
  push:
    branches: [next, main]
    paths:
      - 'migrations/**'
      - 'migrations-pg/**'
      - 'migrations-teardown/**'
      - 'migrations-teardown-pg/**'
      - 'mj-app.json'
      - 'scripts/check-distribution-seed*.mjs'
      - 'scripts/check-release-seed-*.mjs'
      - '.github/scripts/strip-sql-comments.mjs'
      - '.github/workflows/distribution-gate.yml'
  pull_request:
    branches: [next, main]
    paths:
      - 'migrations/**'
      - 'migrations-pg/**'
      - 'migrations-teardown/**'
      - 'migrations-teardown-pg/**'
      - 'mj-app.json'
      - 'scripts/check-distribution-seed*.mjs'
      - 'scripts/check-release-seed-*.mjs'
      - '.github/scripts/strip-sql-comments.mjs'
      - '.github/workflows/distribution-gate.yml'

jobs:
  distribution-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # No dependency install: the gate is Node stdlib only, deliberately, so a dependency problem can never
      # be the reason nobody finds out the app does not install.
      - name: Check shipped placeholders (both dialects + teardown)
        run: node scripts/check-distribution-seed.mjs

      - name: Check the gate itself still fires
        run: node scripts/check-distribution-seed.spec.mjs

      # The release gates themselves run only in publish.yml — between releases they fail by design.
      # Their SELF-TESTS run here too, so a PR that edits a release gate learns it broke the gate
      # before a release does. The cadence spec builds throwaway git repos of its own; it does not
      # need this checkout's history or tags.
      - name: Self-test the release seed gates
        run: |
          node scripts/check-release-seed-coverage.spec.mjs
          node scripts/check-release-seed-cadence.spec.mjs
